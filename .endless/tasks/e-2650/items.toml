[[item]]
id = "P1"
kind = "deliverable"
statement = "cfgstore.CLIConfigFunc[RC, PRC](CLIConfigArgs) returns a cliutil.ConfigFunc whose PRC must implement both RootConfig and cliutil.Config"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The ConfigFunc takes the config slug and file from ConfigArgs.AppInfo, so an app passes no paths"

[[item]]
id = "P3"
kind = "deliverable"
statement = "CLIConfigArgs has optional DirTypes and DirsProvider with the same defaults as LoadConfig"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The ConfigFunc returns the loaded PRC itself as the Config, so cliutil.ConfigAs[*RC] yields the typed root config"

[[item]]
id = "P5"
kind = "deliverable"
statement = "go-cfgstore adds no struct tags, reflection or name-based flag lookup for the adapter"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Tests in test/ cover a CLI layer, a project layer winning over it, slug and file from AppInfo, and a load error, each with a temp DirsProvider"
verify = "go test ./... in test/ with GOWORK=off"

