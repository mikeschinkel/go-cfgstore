[[item]]
id = "P1"
kind = "deliverable"
statement = "A default set in ApplyDefaults does not replace a value the CLI layer set when the project layer omits that key"
verify = "test/ go test"

[[item]]
id = "P2"
kind = "deliverable"
statement = "A project layer that sets a key to false, 0 or an empty string overrides the CLI layer's non-zero value for it"
verify = "test/ go test"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A key absent from every layer holds the value ApplyDefaults set"
verify = "test/ go test"

[[item]]
id = "P4"
kind = "deliverable"
statement = "RootConfig requires ApplyDefaults(DefaultsArgs) error and no longer declares Merge(RootConfig) RootConfig"

[[item]]
id = "P5"
kind = "deliverable"
statement = "RootConfigPtr[RC] requires Merge(MergeArgs[*RC]) error, so an app's Merge receives its own type with no type assertion"

[[item]]
id = "P6"
kind = "deliverable"
statement = "MergeArgs.Decode decodes the layer's file over the given value, leaving fields whose keys the file omits unchanged"
verify = "test/ go test"

[[item]]
id = "P7"
kind = "deliverable"
statement = "MergeArgs.Layer returns the layer's file decoded alone, and a Merge that uses it can apply a rule Decode cannot"
