[[item]]
id = "P1"
kind = "deliverable"
statement = "LoadConfig, LoadDefaultConfig and LoadConfigStores return the result of merging every loaded layer, not the last layer as loaded"
verify = "a test in test/ loading a CLI and a project layer"

[[item]]
id = "P2"
kind = "deliverable"
statement = "With a CLI and a project layer loaded, a field set only in the CLI layer and one set only in the project layer both reach the result, and a field set in both takes the project's value"
verify = "a test in test/ using a test config type with project precedence"

[[item]]
id = "P3"
kind = "deliverable"
statement = "With three layers loaded, each later layer's Merge receives the result of merging all the earlier ones"
verify = "a test in test/ recording what each Merge received"

[[item]]
id = "P4"
kind = "deliverable"
statement = "A Merge that returns a concrete type other than the caller's config type makes loading return an error wrapping ErrFailedToLoadConfig that names the expected type and the returned one"
verify = "a test in test/ whose Merge returns another type"

[[item]]
id = "P5"
kind = "deliverable"
statement = "A Merge that edits its receiver in place and returns it gives the same loaded result as one that returns a copy"
verify = "a test in test/ with both kinds of Merge"

[[item]]
id = "P6"
kind = "deliverable"
statement = "A Merge that returns nil makes loading return an error wrapping ErrFailedToLoadConfig that names the layer, not a nil config"
verify = "a test in test/"

[[item]]
id = "P7"
kind = "deliverable"
statement = "When only one layer loads, it is returned as loaded and Merge is not called"
verify = "a test in test/ whose Merge records any call"

[[item]]
id = "P12"
kind = "deliverable"
statement = "The doc comment on RootConfig.Merge and the README's Understanding Merge() section state that Merge returns the merged config as its receiver's own concrete type, with the receiver's values taking precedence"

