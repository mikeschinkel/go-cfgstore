# Verification suite for E-2650 — a go-cliutil ConfigFunc adapter in go-cfgstore.
# DO NOT EDIT unless you ARE E-2650. See .endless/tasks/CLAUDE.md.

schema = 1
task   = "E-2650"

# The test module's tests first, fail-fast (P1–P4, P6, P7).
[[check]]
name   = "test module unit tests"
runner = "gotest"
dir    = "test"
paths  = ["./..."]

# P9: the comprehensive example's test runs every step.
[[check]]
name   = "P9: examples/comprehensive tests"
runner = "gotest"
dir    = "examples/comprehensive"
paths  = ["./..."]

# P10: the go-cliutil example's cliutiltest table.
[[check]]
name   = "P10: examples/cliutil tests"
runner = "gotest"
dir    = "examples/cliutil"
paths  = ["./..."]

# P9: go run prints the merged layers.
[[check]]
name     = "P9: go run examples/comprehensive"
sh       = "cd examples/comprehensive && GOWORK=off go run . 2>&1"
contains = "merged: theme=dark editor=helix layers=[cli project]"

# P10: a typed flag beats config in a real run.
[[check]]
name     = "P10: go run examples/cliutil with typed flags"
sh       = "cd examples/cliutil && GOWORK=off go run . --region ap show --format csv 2>&1"
contains = "region=ap format=csv format_source=command line"

# P5: the adapter uses no tags, reflection or name lookup.
[[check]]
name   = "P5: cliutil_config.go has no reflect, struct tags or FlagValue"
sh     = "grep -nE 'reflect|`|FlagValue' cliutil_config.go"
equals = ""

# P8: basic_usage is renamed basic, and nothing refers to the old name.
[[check]]
name   = "P8: examples/basic exists and basic_usage is gone"
sh     = "test -f examples/basic/main.go && test ! -e examples/basic_usage && git grep -n basic_usage -- ':!.endless'"
equals = ""

# P11: README documents the wiring and ApplyConfig.
[[check]]
name     = "P11: README has the go-cliutil section"
sh       = "sed -n '/^## Using go-cfgstore with go-cliutil/,/^## Examples/p' README.md | grep -c -e 'CLIConfigFunc\\[RootConfig\\]' -e 'func (o \\*Options) ApplyConfig'"
equals   = "2"

# P12: go-cliutil v0.6.0 (released from E-2648), no replace in the root module.
[[check]]
name   = "P12: go.mod requires go-cliutil v0.6.0 with no replace"
sh     = "! grep -n replace go.mod && GOWORK=off go list -m -f '{{.Path}} {{.Version}}' github.com/mikeschinkel/go-cliutil"
equals = "github.com/mikeschinkel/go-cliutil v0.6.0"

# P13: every module builds, vets and lints clean with golangci-lint v2.15.0.
[[check]]
name = "P13: build, vet and golangci-lint v2.15.0 on every module"
sh   = "set -e; for m in . test examples/basic examples/comprehensive examples/cliutil; do (cd $m && GOWORK=off go build -o "$(mktemp -d)" ./... && GOWORK=off go vet ./... && GOWORK=off go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./... --timeout=5m); done"
