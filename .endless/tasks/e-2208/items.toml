# Plan items for E-2208: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2208 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "LoadConfig, LoadDefaultConfig and LoadConfigStores return the result of merging every loaded layer, not the last layer as loaded"
verify = "a test in test/ loading a CLI and a project layer"

[[item]]
id = "P2"
kind = "deliverable"
statement = "With a CLI and a project layer loaded, a field set only in the CLI layer and one set only in the project layer both reach the result, and a field set in both takes the project's value"
verify = "a test in test/ using a test config type with project precedence"

[[item]]
id = "P3"
kind = "deliverable"
statement = "With three layers loaded, each later layer's Merge receives the result of merging all the earlier ones"
verify = "a test in test/ recording what each Merge received"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The generic constraint RootConfigPtr requires MergeFrom(other *RC) *RC, and RootConfig no longer declares Merge, so a merge method that takes or returns another type fails to compile"

[[item]]
id = "P5"
kind = "deliverable"
statement = "A Merge that edits its receiver in place and returns it gives the same loaded result as one that returns a copy"
verify = "a test in test/ with both kinds of Merge"

[[item]]
id = "P6"
kind = "deliverable"
statement = "A Merge that returns nil makes loading return an error naming the layer, not a nil config"
verify = "a test in test/"

[[item]]
id = "P7"
kind = "deliverable"
statement = "When only one layer loads, it is returned as loaded and Merge is not called"
verify = "a test in test/ whose Merge records any call"

[[item]]
id = "P8"
kind = "deliverable"
statement = "gomion's gomcfg and xmlui's clicfg, mcpcfg and svrcfg each carry a comment at their Merge saying how to change it to the new signature"

[[item]]
id = "P9"
kind = "exclusion"
statement = "Does not tag or push a go-cfgstore release"

[[item]]
id = "P10"
kind = "exclusion"
statement = "Does not change gomion's, or xmlui's clicfg, mcpcfg or svrcfg Merge code; they stay broken until changed by hand"

[[item]]
id = "P11"
kind = "exclusion"
statement = "Does not change doctool, macmail-ext, go-stash or gru"
