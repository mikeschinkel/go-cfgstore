[[item]]
id = "P1"
kind = "deliverable"
statement = "WriterLoggerArgs has optional Writer cliutil.Writer and DirsProvider *DirsProvider fields"
verify = "go build ./... in go-cfgstore"

[[item]]
id = "P2"
kind = "deliverable"
statement = "WriterLoggerArgs.Quiet is *bool and WriterLoggerArgs.Verbosity is *cliutil.Verbosity, and nil means not provided"
verify = "go build ./... in go-cfgstore"

[[item]]
id = "P3"
kind = "deliverable"
statement = "With no Writer, CreateWriterLogger builds one from IO, Quiet (false when nil) and Verbosity (cliutil.LowVerbosity when nil)"
verify = "a test in test/ sees verbosity-1 output and no V2 output with Quiet and Verbosity nil"

[[item]]
id = "P4"
kind = "deliverable"
statement = "With a Writer, CreateWriterLogger applies a provided Quiet with WithQuiet and a provided Verbosity with WithVerbosity, and keeps the Writer's own setting for each one not provided"
verify = "tests in test/ with the settings provided and with them nil"

[[item]]
id = "P5"
kind = "deliverable"
statement = "A provided Verbosity of 0 (cliutil.NoVerbosity) is accepted and makes Printf write nothing"
verify = "a test in test/"

[[item]]
id = "P6"
kind = "deliverable"
statement = "CreateWriterLogger returns ErrWriterAndIO, wrapped in ErrFailedWriterSetup, when both Writer and IO are set, and creates no log file"
verify = "a test in test/ checks errors.Is and the absent log file"

[[item]]
id = "P7"
kind = "deliverable"
statement = "The log file lands under CLIConfigDir(ConfigSlug, DirsProvider)/logs, and a nil DirsProvider means DefaultDirsProvider()"
verify = "a test in test/ finds the log under a DirsProvider rooted in t.TempDir()"

[[item]]
id = "P8"
kind = "deliverable"
statement = "examples/comprehensive and the tests in test/ use the new fields and pass"
verify = "go test ./... in test/ and go build ./... in examples/comprehensive"

[[item]]
id = "P10"
kind = "exclusion"
statement = "Does not change gomion's RunCLI call"

[[item]]
id = "P11"
kind = "deliverable"
statement = "go-cfgstore has a new minor-version tag containing this change, pushed"
verify = "git ls-remote --tags origin shows the tag on the landed commit"
post_land = true

[[item]]
id = "P12"
kind = "deliverable"
statement = "When the CLI config logs dir cannot be written, CreateWriterLogger logs under a new temp directory, and prints its 'Logging to ... instead' message only after that directory exists"
verify = "a test in test/ with an unwritable logs dir finds the log under a new temp dir"
detail = "Folded in from E-2676: createLogger used dt.CreateTemp, which makes a file, then MkdirAll on its path"
